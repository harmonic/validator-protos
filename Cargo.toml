[package]
name = "validator-protos"
version = "0.1.0"
edition = "2024"
description = "Rust bindings for the Harmonic validator proto definitions"
license = "Apache-2.0"
repository = "https://github.com/harmonic/validator-protos"

[features]
default = []
client = []
server = []

[build-dependencies]
tonic-prost-build = "0.14"

[target."cfg(not(windows))".build-dependencies]
protobuf-src = "1.1"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
